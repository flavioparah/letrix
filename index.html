<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>Letrix · O eco</title><style>*{box-sizing:border-box}body{margin:0;background:#05090b;overflow:hidden}canvas{display:block;width:100vw;height:100dvh;touch-action:none}.pad{position:fixed;bottom:max(4%,env(safe-area-inset-bottom));width:76px;height:76px;border:1px solid #cdc8a74f;border-radius:50%;display:none;place-items:center;touch-action:none;user-select:none;color:#e0dcc2aa;background:#08101150;font:20px monospace}.pad span{pointer-events:none}#move{left:5%}#look{right:5%}@media(any-pointer:coarse){.pad{display:grid}}#hint{position:fixed;left:0;right:0;bottom:22%;text-align:center;color:#f0e5c9;text-shadow:0 1px 5px #000;font:13px system-ui;pointer-events:none;animation:fade 7s forwards}@keyframes fade{0%,65%{opacity:1}100%{opacity:0}}#sound{position:fixed;right:18px;top:16px;background:#08101190;border:1px solid #aab7a055;border-radius:50%;width:44px;height:44px;color:#deceae;font:18px Georgia} </style><canvas aria-label="Letrix. Explore e toque nas palavras inscritas no cenário."></canvas><div class="pad" id="move" aria-label="Andar"><span>✥</span></div><div class="pad" id="look" aria-label="Girar a câmera"><span>◎</span></div><div id="hint">LETRIX · O ECO　|　Aproxime-se das letras na pedra.</div><button id="sound" aria-label="Ativar trilha sonora" aria-pressed="false">♫</button><script>

if(!matchMedia('(any-pointer:coarse)').matches)hint.textContent='LETRIX · O ECO　|　WASD para andar · arraste para olhar · clique nas letras';
let last=0;function frame(ms){let t=ms/1000,dt=Math.min(.05,t-last);last=t;
yaw+=((keys.has('arrowright')?1:0)-(keys.has('arrowleft')?1:0))*dt*1.65;
let f=Number(keys.has('w')||keys.has('arrowup'))-Number(keys.has('s')||keys.has('arrowdown'))-jy,l=Number(keys.has('d'))-Number(keys.has('a'))+jx,m=Math.max(1,Math.hypot(f,l)),sn=Math.sin(yaw),cs=Math.cos(yaw),step=3.3*dt/m;
yaw+=turnX*dt*1.9;tilt=Math.max(-.65,Math.min(.65,tilt-turnY*dt));let nx=px+(f*sn+l*cs)*step,nz=pz+(f*cs-l*sn)*step;if(valid(nx,pz))px=nx;if(valid(px,nz))pz=nz;

ctx.fillStyle='#9db8bb55';ctx.font='12px monospace';for(let i=0;i<55;i++){let y=(i*971+t*(175+i%5*15))%(H+20),x=((i*673-y*.22)%(W+20)+W+20)%(W+20);ctx.fillText('╱',x,y)}
